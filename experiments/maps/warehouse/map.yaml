# Ground-truth occupancy map generated from the Isaac USD by
# experiments/make_occupancy_map.py. Map frame anchored at the rover
# start pose (rover start = (0,0)), so goals.yaml lines up unchanged.
image: map.pgm
mode: trinary
resolution: 0.05
origin: [-26.0000, -26.0000, 0.0]
negate: 0
occupied_thresh: 0.65
free_thresh: 0.25
