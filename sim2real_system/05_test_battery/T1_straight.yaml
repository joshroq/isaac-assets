name: T1_straight
# Straight line then stop. Isolates v_ss, distance, accel ramp (tau_v), coast.
# Start the rover at one edge of the grid facing across it.
steps:
  - {linear: 0.00, angular: 0.0, duration: 1.0}   # settle
  - {linear: 0.15, angular: 0.0, duration: 4.0}   # forward ~0.6 m
  - {linear: 0.00, angular: 0.0, duration: 3.0}   # stop + coast
