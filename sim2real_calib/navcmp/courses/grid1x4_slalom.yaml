# Slalom down the 4 m x 1 m taped grid and back.
# Course frame = overhead grid frame (x along the 4 m side, y along the 1 m side).
#
# BUILD IT (real rover): a 1.6 m-wide corridor - long walls 0.30 m outside the 1 m
# grid edges, end walls 0.30 m beyond the grid ends (>= 0.40 m tall) - and two
# 0.30 m boxes, one hugging each side, so the rover must weave.
name: grid1x4_slalom
description: >
  Down-and-back slalom: start at the x=0 end facing +x, weave past two staggered
  boxes to the far end, turn around, weave back to start. Long legs with
  sustained arcs - where the drive-response calibration matters most.
start: {x: 0.30, y: 0.50, yaw_deg: 0}
goals:
  - {name: far_end, x: 3.70, y: 0.50, yaw_deg: 180}
return_to_start: true
goal_timeout_s: 150
walls:
  - {name: south, from: [-0.30, -0.30], to: [4.30, -0.30], height: 0.40}
  - {name: east,  from: [4.30, -0.30],  to: [4.30, 1.30],  height: 0.40}
  - {name: north, from: [4.30, 1.30],   to: [-0.30, 1.30], height: 0.40}
  - {name: west,  from: [-0.30, 1.30],  to: [-0.30, -0.30], height: 0.40}
boxes:
  - {name: box_low,  center: [1.40, 0.30], size: [0.30, 0.30, 0.35]}
  - {name: box_high, center: [2.60, 0.70], size: [0.30, 0.30, 0.35]}
fence: {xmin: -0.20, xmax: 4.20, ymin: -0.20, ymax: 1.20}
